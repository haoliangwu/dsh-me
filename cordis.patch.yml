# dsh-me bundle: one row per bundled plugin, addressed by profile layers
# (and the user's cordis.patch.yml) by id. Sub-plugin ids keep their
# historical names so existing profile config rows keep applying.
#
# The dsh-me root row anchors the merged client bundle: dsh-client-modules
# keys the dsh.client scan on a fiber's package-root entry name (subpath
# fibers are skipped), so exactly one fiber must mount the bare package.
- insert:
    - id: dsh-me
      name: dsh-me
    - id: dsh-ui-peak-rate
      name: dsh-me/plugins/peak-rate
    - id: dsh-ui-notification
      name: dsh-me/plugins/notification
    - id: dsh-session-messenger
      name: dsh-me/plugins/session-messenger
    - id: dsh-caveman
      name: dsh-me/plugins/caveman
    - id: dsh-btw
      name: dsh-me/plugins/btw
    - id: dsh-x-opencode-session-shim
      name: dsh-me/plugins/x-opencode-session-shim
    - id: dsh-reference
      name: dsh-me/plugins/reference
    - id: dsh-undo
      name: dsh-me/plugins/undo
