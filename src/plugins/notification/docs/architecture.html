<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-ui-notification architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      border-top: 1px solid rgba(45, 49, 66, 0.12);
      margin-top: 1.5rem;
      padding-top: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>dsh-ui-notification: Session Notification Architecture</h1>

    <svg viewBox="0 0 1104 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notification-architecture-title notification-architecture-desc">
      <title id="notification-architecture-title">dsh-ui-notification architecture</title>
      <desc id="notification-architecture-desc">Architecture of the dsh-ui-notification plugin: two session triggers pass a visibility and config gate into a coral notify dispatcher that plays a chime and delivers the notification through the browser Notification API or the host RPC endpoint to a native macOS banner.</desc>
      <defs>
        <marker id="notification-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="notification-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="notification-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: renderer region (painted before arrows and nodes). -->
      <rect x="32" y="8" width="1048" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="12" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="96" y="20" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT RENDERER</text>

      <!-- ── Arrows (drawn before boxes) ─────────────────────────────────── -->
      <!-- turn/end watcher → gate -->
      <path d="M 280,108 H 316 Q 324,108 324,116 V 136 Q 324,144 332,144 H 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-arrow)"/>
      <!-- pendingInteraction diff → gate -->
      <line x1="280" y1="196" x2="352" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-arrow)"/>
      <!-- gate → dispatcher -->
      <line x1="520" y1="160" x2="600" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-arrow)"/>
      <!-- dispatcher → chime -->
      <path d="M 688,112 V 92 Q 688,84 696,84 H 856" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-arrow)"/>
      <!-- dispatcher → Notification API (browser path) -->
      <line x1="776" y1="176" x2="856" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#notification-arrow)"/>
      <!-- dispatcher → host (desktop RPC path) -->
      <path d="M 640,208 V 312 Q 640,320 648,320 H 948 Q 956,320 956,328 V 352" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#notification-arrow-link)"/>
      <!-- host → macOS banner (terminal-notifier / osascript) -->
      <line x1="956" y1="448" x2="956" y2="488" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#notification-arrow-link)"/>
      <!-- host → gate: config toggles (passive return, dashed) -->
      <path d="M 856,400 H 444 Q 436,400 436,392 V 208" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#notification-arrow-link)"/>

      <!-- ── Arrow labels: masked, 8px gap above each connector ──────────── -->
      <rect x="292" y="88" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">turn/end</text>

      <rect x="292" y="176" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pending</text>

      <rect x="536" y="140" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">pass</text>

      <rect x="756" y="64" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="780" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">chime</text>

      <rect x="792" y="156" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="816" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">browser</text>

      <rect x="728" y="300" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RPC notify</text>

      <rect x="916" y="460" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="932" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">exec</text>

      <rect x="576" y="380" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">config</text>

      <!-- ── Nodes (painted after arrows) ────────────────────────────────── -->
      <!-- 1. turn/end watcher -->
      <rect x="48" y="64" width="232" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="64" width="232" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="68" width="40" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="76" y="76" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>
      <text x="164" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">回合结束监视</text>
      <text x="164" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session.eventSource · append</text>

      <!-- 2. pendingInteraction diff -->
      <rect x="48" y="176" width="232" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="176" width="232" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="180" width="40" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="76" y="188" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>
      <text x="164" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">待交互差异</text>
      <text x="164" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uiSession.sessionStatus</text>

      <!-- 3. visibility + config gate -->
      <rect x="352" y="112" width="168" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="112" width="168" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="436" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">可见性与开关门</text>
      <text x="436" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shouldNotify()</text>

      <!-- 4. notify dispatcher (the one coral focal node) -->
      <rect x="600" y="112" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="112" width="176" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="688" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">通知分发器</text>
      <text x="688" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">title · body · variant</text>

      <!-- 5. chime synth -->
      <rect x="856" y="40" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="40" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="956" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">提示音合成</text>
      <text x="956" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Web Audio · 3 patterns</text>

      <!-- 6. browser Notification API -->
      <rect x="856" y="136" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="136" width="200" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="864" y="140" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="884" y="148" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BROWSER</text>
      <text x="956" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">Notification API</text>
      <text x="956" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lazy permission · silent</text>

      <!-- 7. host /notification channel -->
      <rect x="856" y="352" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="352" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="864" y="356" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="880" y="364" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="956" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">Host /notification</text>
      <text x="956" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config · notify</text>

      <!-- 8. macOS banner (external) -->
      <rect x="856" y="488" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="488" width="200" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="864" y="492" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="888" y="500" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="956" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', system-ui, sans-serif" text-anchor="middle">macOS 横幅</text>
      <text x="956" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">terminal-notifier / osascript</text>

      <!-- ── Legend: horizontal strip at the bottom ──────────────────────── -->
      <line x1="32" y1="600" x2="1072" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="136" y="608" width="20" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="164" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">focal</text>

      <rect x="256" y="608" width="20" height="8" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="284" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">core step</text>

      <rect x="372" y="608" width="20" height="8" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">trigger</text>

      <rect x="476" y="608" width="20" height="8" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="504" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">external</text>

      <line x1="584" y1="612" x2="608" y2="612" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="616" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">internal flow</text>

      <line x1="720" y1="612" x2="744" y2="612" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="752" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RPC / OS call</text>

      <line x1="856" y1="612" x2="880" y2="612" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="888" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">config read</text>
    </svg>

    <footer class="colophon">dsh-me · src/plugins/notification · diagram-design skill · light skin</footer>
  </div>
</body>
</html>
