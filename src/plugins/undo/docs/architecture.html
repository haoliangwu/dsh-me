    <p class="eyebrow">Architecture · dsh-me / dsh-undo</p>
    <h1>Undo &amp; Redo by Tombstone Shadowing</h1>
    <p class="subtitle">One Connection-RPC channel, one per-session queue, one append-only session log: undo appends a tombstone that shadows the turn; redo replays it as a fake turn.</p>
