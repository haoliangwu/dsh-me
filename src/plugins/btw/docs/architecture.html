<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-btw 插件架构图</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--color-muted);
      border-top: 1px solid rgba(45,49,66,0.12);
      padding-top: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>dsh-btw 插件架构</h1>

    <svg viewBox="0 0 1040 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="btw-architecture-title btw-architecture-desc">
      <title id="btw-architecture-title">dsh-btw 插件架构图</title>
      <desc id="btw-architecture-desc">Architecture of the /btw plugin: the browser chat input crosses the Connection RPC into the host command handler, which parses the request, reads same-workspace sessions, packs a read-only snapshot in the pure core, runs a child agent whose answer returns to the browser card while only the child session is appended to the DSH session log.</desc>
      <defs>
        <marker id="btw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="btw-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="btw-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones: browser client, host runtime, platform boundary. -->
      <rect x="40" y="40" width="744" height="176" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="44" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="92" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BROWSER CLIENT</text>

      <rect x="40" y="248" width="744" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="252" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="84" y="261" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST RUNTIME</text>

      <rect x="816" y="40" width="184" height="504" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="824" y="44" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="852" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PLATFORM</text>

      <!-- Arrows, drawn before boxes. -->
      <!-- A: chat input -> command handler (Connection RPC) -->
      <path d="M 172,168 V 296" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#btw-arrow-link)"/>
      <!-- B: config -> handler (passive) -->
      <path d="M 172,424 V 376" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#btw-arrow)"/>
      <!-- C: handler -> pure core -->
      <path d="M 272,336 H 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btw-arrow)"/>
      <!-- D: handler -> session query (workspace gate) -->
      <path d="M 232,376 V 392 Q 232,400 240,400 H 392 Q 400,400 400,408 V 424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btw-arrow)"/>
      <!-- E: session query -> pure core (surface events) -->
      <path d="M 480,424 V 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btw-arrow)"/>
      <!-- F: pure core -> child agent (prompt) -->
      <path d="M 520,336 H 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btw-arrow)"/>
      <!-- G: child agent -> answer card (Connection RPC) -->
      <path d="M 664,296 V 168" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#btw-arrow-link)"/>
      <!-- H: child agent -> session log (child lineage append) -->
      <path d="M 768,324 H 784 Q 792,324 792,316 V 112 Q 792,104 800,104 H 836" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btw-arrow)"/>
      <!-- I: session log -> session query (readSurface) -->
      <path d="M 836,136 H 816 Q 808,136 808,144 V 456 Q 808,464 800,464 H 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btw-arrow)"/>

      <!-- Arrow labels: opaque masks, 8px visible gap from their stroke. -->
      <rect x="100" y="224" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="132" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RPC INPUT</text>

      <rect x="84" y="392" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="124" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUDGET KNOBS</text>

      <rect x="276" y="312" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="296" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARSE</text>

      <rect x="272" y="380" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="316" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WORKSPACE GATE</text>

      <rect x="420" y="392" width="52" height="16" rx="2" fill="#f5f5f5"/>
      <text x="446" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SURFACE</text>

      <rect x="524" y="312" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="544" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

      <rect x="584" y="224" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="620" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER TEXT</text>

      <rect x="700" y="224" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="742" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHILD LINEAGE</text>

      <rect x="816" y="292" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="856" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ SURFACE</text>

      <!-- Nodes. -->

      <!-- N1: chat composer (input) -->
      <rect x="72" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="88" width="200" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="80" y="96" width="32" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="96" y="105" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="172" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">聊天输入框</text>
      <text x="172" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rawInput · 3 channels</text>

      <!-- N2: answer command card (UI output) -->
      <rect x="568" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="88" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="576" y="96" width="24" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="588" y="105" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="668" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">答案卡片</text>
      <text x="668" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commandview slot · btw</text>

      <!-- N3: command handler (host) -->
      <rect x="72" y="296" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="296" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="304" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="96" y="313" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="172" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">命令处理器</text>
      <text x="172" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commands.register</text>
      <text x="172" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recordInput: false</text>

      <!-- N4: pure decision core (focal) -->
      <rect x="320" y="296" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="296" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="328" y="304" width="32" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="344" y="313" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="420" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">纯决策核心</text>
      <text x="420" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parse · resolve · pack</text>
      <text x="420" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">snapshot · extract</text>

      <!-- N5: session query (host) -->
      <rect x="320" y="424" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="424" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="432" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="344" y="441" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>
      <text x="420" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">会话读取</text>
      <text x="420" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">filterSessions · readSurface</text>

      <!-- N6: child agent runner (focal) -->
      <rect x="568" y="296" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="296" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="576" y="304" width="32" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="592" y="313" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="668" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">子 agent 运行器</text>
      <text x="668" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agents.create · whenIdle</text>
      <text x="668" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parentSession · depth 1</text>

      <!-- N7: plugin config (input) -->
      <rect x="72" y="424" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="424" width="200" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="80" y="432" width="40" height="12" rx="2" fill="none" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="100" y="441" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONFIG</text>
      <text x="172" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">插件配置</text>
      <text x="172" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">snapshotBytes 16 KiB</text>
      <text x="172" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contextMessageLimit 10</text>

      <!-- N8: DSH session log (external store) -->
      <rect x="836" y="72" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="72" width="144" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="844" y="80" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="868" y="89" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="908" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">dsh 会话日志</text>
      <text x="908" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">readSurface · titles</text>
      <text x="908" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parent log untouched</text>

      <!-- Legend: horizontal strip at the bottom, hairline separator. -->
      <line x1="40" y1="568" x2="1000" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="112" y1="584" x2="136" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#btw-arrow)"/>
      <text x="144" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DATA FLOW</text>

      <line x1="224" y1="584" x2="248" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#btw-arrow)"/>
      <text x="256" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CONFIG INPUT</text>

      <line x1="356" y1="584" x2="380" y2="584" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#btw-arrow-link)"/>
      <text x="388" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CONNECTION RPC</text>

      <rect x="496" y="576" width="24" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

      <rect x="600" y="576" width="24" height="12" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>

      <rect x="720" y="576" width="24" height="12" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>

    <footer class="colophon">dsh-me · src/plugins/btw · architecture · self-contained HTML, no build step</footer>
  </div>
</body>
</html>
