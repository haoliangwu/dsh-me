<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-memory plugin architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 60rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .footer {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      border-top: 1px solid rgba(45, 49, 66, 0.12);
      margin-top: 1.5rem;
      padding-top: 0.75rem;
    }

    /* SVG text roles */
    svg .zlabel {
      font-family: var(--font-mono);
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.14em;
      fill: rgba(45, 49, 66, 0.40);
      text-anchor: middle;
    }
    svg .ntag {
      font-family: var(--font-mono);
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.08em;
      fill: #4f5d75;
      text-anchor: middle;
    }
    svg .nname {
      font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #2d3142;
      text-anchor: middle;
    }
    svg .nsub {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 400;
      fill: #4f5d75;
      text-anchor: middle;
    }
    svg .alabel {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.06em;
      fill: #7a8399;
      text-anchor: middle;
    }
    svg .legtitle {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.14em;
      fill: #4f5d75;
    }
    svg .legitem {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.06em;
      fill: #4f5d75;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>dsh-memory plugin architecture</h1>
    <p class="subtitle">Cross-session memory for DSH — checkpoint harvest, dual-pool injection, memory tools, and the read-only Memory tab.</p>

    <svg viewBox="0 0 1056 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-title memory-desc">
      <title id="memory-title">dsh-memory plugin architecture</title>
      <desc id="memory-desc">Architecture of the dsh-memory plugin: compaction checkpoints are harvested from the session log into a SQLite store, the agent/pre-step hook assembles a dual-pool memory block into an injected row seen by the model, the memory tools and the /memory-tidy command write and reorganize the store, and the Memory tab reads the identical block over the /dsh-memory RPC channel.</desc>
      <defs>
        <marker id="memory-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="memory-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="memory-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <g id="memory-zone-external">
        <rect x="32" y="40" width="200" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="76" y="44" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text class="zlabel" x="132" y="52">EXTERNAL BOUNDARIES</text>
      </g>
      <g id="memory-zone-plugin">
        <rect x="280" y="40" width="472" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="464" y="44" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text class="zlabel" x="516" y="52">DSH-MEMORY PLUGIN</text>
      </g>
      <g id="memory-zone-surface">
        <rect x="816" y="40" width="224" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="880" y="44" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text class="zlabel" x="928" y="52">SESSION SURFACE</text>
      </g>

      <!-- Arrows (drawn before boxes) -->
      <g id="memory-arrows">
        <!-- 1. session log -> store: harvest -->
        <path d="M 132,136 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/>
        <!-- 2. store -> assembler: active rows -->
        <path d="M 216,216 H 256 Q 264,216 264,208 V 72 Q 264,64 272,64 H 640 Q 648,64 648,72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/>
        <!-- 3. pre-step -> assembler: assemble -->
        <path d="M 488,104 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/>
        <!-- 4. assembler -> injected row -->
        <path d="M 736,104 H 848" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/>
        <!-- 5. injected row -> model context -->
        <path d="M 936,136 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/>
        <!-- 6. tools -> store: write/forget -->
        <path d="M 312,256 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/>
        <!-- 7. /memory-tidy -> pre-step: steer -->
        <path d="M 488,392 H 504 Q 512,392 512,384 V 128 Q 512,120 504,120 H 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#memory-arrow)"/>
        <!-- 8. tools -> pre-step: arm refresh (dashed, control flag) -->
        <path d="M 400,224 V 136" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#memory-arrow)"/>
        <!-- 9. memory tab -> assembler: RPC block read (link) -->
        <path d="M 848,400 H 776 Q 768,400 768,392 V 128 Q 768,120 760,120 H 736" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#memory-arrow-link)"/>
      </g>

      <!-- Arrow labels: opaque masks with 6-10px visible gap -->
      <g id="memory-arrow-labels">
        <rect x="140" y="156" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="160" y="164">HARVEST</text>

        <rect x="272" y="144" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="304" y="152">ACTIVE ROWS</text>

        <rect x="500" y="84" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="524" y="92">ASSEMBLE</text>

        <rect x="752" y="84" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="792" y="92">APPEND/REPLACE</text>

        <rect x="944" y="172" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="964" y="180">INJECT</text>

        <rect x="228" y="236" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="264" y="244">WRITE/FORGET</text>

        <rect x="520" y="248" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="538" y="256">STEER</text>

        <rect x="408" y="172" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="440" y="180">ARM REFRESH</text>

        <rect x="776" y="252" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text class="alabel" x="804" y="260">RPC BLOCK</text>
      </g>

      <!-- Nodes -->
      <g id="memory-node-session-log">
        <rect x="48" y="72" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="72" width="168" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="56" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="76" y="88">EVENT</text>
        <text class="nname" x="132" y="112">DSH session log</text>
        <text class="nsub" x="132" y="128">compaction checkpoint</text>
      </g>

      <g id="memory-node-store">
        <rect x="48" y="192" width="168" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="192" width="168" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="56" y="200" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="76" y="208">STORE</text>
        <text class="nname" x="132" y="240">SQLite store</text>
        <text class="nsub" x="132" y="256">dsh-memory/memory.db</text>
      </g>

      <g id="memory-node-pre-step">
        <rect x="312" y="72" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="312" y="72" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="320" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="336" y="88">HOOK</text>
        <text class="nname" x="400" y="112">agent/pre-step</text>
        <text class="nsub" x="400" y="128">pre-step injection</text>
      </g>

      <g id="memory-node-assembler">
        <rect x="560" y="72" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="72" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="568" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="584" y="88">PURE</text>
        <text class="nname" x="648" y="112">Dual-pool assembler</text>
        <text class="nsub" x="648" y="128">assembleMemoryBlock</text>
      </g>

      <g id="memory-node-injected-row">
        <rect x="848" y="72" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="72" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="856" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="872" y="88">ROW</text>
        <text class="nname" x="936" y="112">Injected memory row</text>
        <text class="nsub" x="936" y="128">plugin source · digest</text>
      </g>

      <g id="memory-node-tools">
        <rect x="312" y="224" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="312" y="224" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="320" y="232" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="340" y="240">TOOLS</text>
        <text class="nname" x="400" y="264">Memory tools</text>
        <text class="nsub" x="400" y="280">write · list · forget</text>
      </g>

      <g id="memory-node-tidy">
        <rect x="312" y="360" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="312" y="360" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="320" y="368" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="336" y="376">CMD</text>
        <text class="nname" x="400" y="400">/memory-tidy</text>
        <text class="nsub" x="400" y="416">steer reorg turn</text>
      </g>

      <g id="memory-node-model-context">
        <rect x="848" y="224" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="224" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="856" y="232" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="872" y="240">LLM</text>
        <text class="nname" x="936" y="264">Model context</text>
        <text class="nsub" x="936" y="280">receives durable row</text>
      </g>

      <g id="memory-node-memory-tab">
        <rect x="848" y="360" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="848" y="360" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="856" y="368" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.24)" stroke-width="0.8"/>
        <text class="ntag" x="868" y="376">UI</text>
        <text class="nname" x="936" y="400">Memory tab</text>
        <text class="nsub" x="936" y="416">/dsh-memory · block</text>
      </g>

      <!-- Legend: horizontal strip at bottom -->
      <g id="memory-legend">
        <line x1="32" y1="472" x2="1024" y2="472" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text class="legtitle" x="32" y="496">LEGEND</text>

        <rect x="136" y="484" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text class="legitem" x="160" y="496">FOCAL</text>

        <rect x="288" y="484" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="legitem" x="312" y="496">COMPONENT</text>

        <rect x="440" y="484" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text class="legitem" x="464" y="496">STORE DATA</text>

        <rect x="592" y="484" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text class="legitem" x="616" y="496">EXTERNAL</text>

        <line x1="744" y1="490" x2="760" y2="490" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text class="legitem" x="768" y="496">CONTROL</text>

        <line x1="896" y1="490" x2="912" y2="490" stroke="#2e5aa8" stroke-width="1.2"/>
        <text class="legitem" x="920" y="496">RPC READ</text>
      </g>
    </svg>

    <p class="footer">dsh-me · src/plugins/memory · Diagram Design</p>
  </div>
</body>
</html>
